[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-server"
version = "0.1.0"
description = "Human-in-the-loop evidence workspace MCP server (Python twin)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2", "pydantic>=2.7", "jsonschema>=4.20"]

[project.scripts]
hitl-server = "hitl_server.__main__:main"
hitl-audit = "hitl_server.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

